aid: wonderment
name: Wonderment
description: >-
  Wonderment is a post-purchase order-tracking and shipment-visibility platform
  for ecommerce brands (built for Shopify), now part of Loop as Loop Tracking.
  It ingests carrier tracking data, surfaces proactive delivery updates, powers
  branded self-serve tracking pages, and reports on shipment performance. The
  public REST API (versioned 2022-10, hosted at api.wonderment.com) lets
  merchants search shipments by order name or tracking code, list and download
  shipment report exports, and fetch delivery-date predictions for shipping
  methods, plus webhooks for shipping events. Originally a CRV-backed company,
  added to the API Evangelist network and enriched from its ReadMe developer hub.
